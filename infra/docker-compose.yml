name: vibecode

# Local-only Compose stack. Postgres password `localdb` is not a production secret.
# Nakama Console still uses Heroic Labs built-in local defaults (admin / password).
# Do not put production credentials in this file.

services:
  postgres:
    image: postgres:16.15-alpine
    container_name: vibecode-postgres
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    volumes:
      - vibecode_postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nakama"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nakama:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: vibecode-nakama:3.40.0
    container_name: vibecode-nakama
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama
        --config /nakama/data/local.yml
        --database.address postgres:localdb@postgres:5432/nakama
        --logger.level DEBUG
        --runtime.js_entrypoint build/index.js
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../server/build:/nakama/data/modules/build:ro
      - ./nakama/local.yml:/nakama/data/local.yml:ro
    expose:
      - "7349"
      - "7350"
      - "7351"
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.7
    container_name: vibecode-mailpit
    expose:
      - "1025"
      - "8025"
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  auth-gateway:
    build:
      context: ../auth-gateway
      dockerfile: Dockerfile
    image: vibecode-auth-gateway:1.0.0
    container_name: vibecode-auth-gateway
    environment:
      AUTH_GATEWAY_ENV: local
      AUTH_GATEWAY_LISTEN_HOST: 0.0.0.0
      AUTH_GATEWAY_LISTEN_PORT: "8787"
      AUTH_GATEWAY_PUBLIC_BASE_URL: http://127.0.0.1:8787
      EMAIL_PROVIDER: mailpit
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      EMAIL_HEALTH_URL: http://mailpit:8025/api/v1/info
      EMAIL_FROM: Vibecode <no-reply@localhost>
      EMAIL_SUPPORT_ADDRESS: support@localhost
      NAKAMA_HTTP_URL: http://nakama:7350
      NAKAMA_SERVER_KEY: defaultkey
      NAKAMA_HTTP_KEY: defaulthttpkey
      VIBECODE_EMAIL_HMAC_PEPPER: local-email-hmac-pepper-not-production
      VIBECODE_GATEWAY_HMAC_SECRET: local-gateway-hmac-secret-not-production
      VIBECODE_CHALLENGE_HMAC_SECRET: local-challenge-hmac-secret-not-production
      AUTH_REGISTRATION_MODE: OPEN
      AUTH_TERMS_VERSION: "1"
      AUTH_PRIVACY_VERSION: "1"
      AUTH_MIN_CLIENT_VERSION: "1.0.0"
      AUTH_MAX_CLIENT_VERSION: "1.0.0"
      AUTH_VERIFICATION_TTL_MS: "1800000"
      AUTH_UNVERIFIED_RETENTION_MS: "604800000"
      AUTH_LOGOUT_ALL_RECENT_MS: "300000"
    depends_on:
      nakama:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8787:8787"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  vibecode_postgres_data:
    name: vibecode_postgres_data
