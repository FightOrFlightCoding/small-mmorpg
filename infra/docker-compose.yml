name: vibecode

# Local-only Compose stack. Postgres password `localdb` is not a production secret.
# Nakama Console still uses Heroic Labs built-in local defaults (admin / password).
# Do not put production credentials in this file.

services:
  postgres:
    image: postgres:16.15-alpine
    container_name: vibecode-postgres
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    volumes:
      - vibecode_postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nakama"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nakama:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: vibecode-nakama:3.40.0
    container_name: vibecode-nakama
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama
        --config /nakama/data/local.yml
        --database.address postgres:localdb@postgres:5432/nakama
        --logger.level DEBUG
        --runtime.js_entrypoint build/index.js
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../server/build:/nakama/data/modules/build:ro
      - ./nakama/local.yml:/nakama/data/local.yml:ro
    expose:
      - "7349"
      - "7350"
      - "7351"
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  vibecode_postgres_data:
    name: vibecode_postgres_data
