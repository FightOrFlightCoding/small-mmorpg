name: vibecode-staging

# Example staging stack. Copy to docker-compose.staging.yml and point env_file at a gitignored secrets file.
# Do not commit real passwords.

services:
  postgres:
    image: postgres:16.15-alpine
    container_name: vibecode-staging-postgres
    env_file:
      - .env.staging
    environment:
      POSTGRES_DB: nakama_staging
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - vibecode_staging_postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nakama_staging"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nakama:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: vibecode-nakama:3.40.0
    container_name: vibecode-staging-nakama
    env_file:
      - .env.staging
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:$${POSTGRES_PASSWORD}@postgres:5432/nakama_staging &&
        exec /nakama/nakama
        --config /nakama/data/staging.yml
        --database.address postgres:$${POSTGRES_PASSWORD}@postgres:5432/nakama_staging
        --logger.level INFO
        --runtime.js_entrypoint build/index.js
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../server/build:/nakama/data/modules/build:ro
      - ./nakama/staging.example.yml:/nakama/data/staging.yml:ro
    ports:
      - "7350:7350"
      - "7351:7351"
    restart: unless-stopped

volumes:
  vibecode_staging_postgres_data:
    name: vibecode_staging_postgres_data
